version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: usuario-gerenciador-db
    environment:
      POSTGRES_DB: usuario_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - usuario-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  usuario-network:
    driver: bridge

